[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only the shared helpers are packaged. Installing them in editable mode
# (pip install -e .) lets every project folder do `from common import ...`.
[project]
name = "finance-portfolio-common"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
